[package]
name = "f1-widget"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.29"
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
svgtypes = "0.16.1"
roxmltree = "0.21.1"
winres = "0.1.12"
self_update = "1.3.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
roxmltree = "0.20"
svgtypes = "0.15"

[build-dependencies]
winres = "0.1"
